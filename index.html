<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MiTorneo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F1;--sf:#fff;--tx:#14201A;--mt:#5C6B62;--ln:#D5DDD6;--gr:#1E5B3A;--g2:#2A7449;--ac:#E8C547;--rd:#B3392F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1812;--sf:#16241C;--tx:#E6EEE8;--mt:#93A59A;--ln:#27382D;--gr:#3E9B67;--g2:#4DB57A;--rd:#C9483D}}
:root[data-theme="dark"]{--bg:#0E1812;--sf:#16241C;--tx:#E6EEE8;--mt:#93A59A;--ln:#27382D;--gr:#3E9B67;--g2:#4DB57A;--rd:#C9483D}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Barlow,system-ui,sans-serif}
header,main{max-width:920px;margin:0 auto;padding:0 16px}header{padding-top:18px}main{padding-bottom:40px}
h1{font:700 36px/1 'Barlow Condensed',Impact,sans-serif;margin:0 0 12px}
h2{font:700 26px/1.1 'Barlow Condensed',Impact,sans-serif;margin:18px 0 8px}h3{font:600 19px 'Barlow Condensed',sans-serif;margin:16px 0 6px}
nav{display:flex;overflow-x:auto;border-bottom:2px solid var(--ln)}
nav button{border:0;border-radius:0;background:none;color:var(--mt);padding:10px 14px;font:600 15px Barlow,sans-serif;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button.on{color:var(--tx);border-color:var(--gr)}
button{font:500 14px Barlow,sans-serif;padding:8px 12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:6px;cursor:pointer}button:hover{border-color:var(--gr)}
.pr{background:var(--gr);color:#fff;border-color:var(--gr)}.dg{background:var(--rd);color:#fff;border-color:var(--rd)}.sm{padding:3px 10px}
:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--tx);min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.row input[type=text]{flex:1 1 180px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.tr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.nm{flex:1 1 140px}.num{width:30px;text-align:right;font-weight:600}.mt{color:var(--mt)}
.bar{flex:1 1 120px;max-width:240px;height:10px;background:var(--ln);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--v);background:repeating-linear-gradient(90deg,var(--gr) 0 10px,var(--g2) 10px 20px)}
.pks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px;max-height:240px;overflow:auto;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
.pks label{display:flex;gap:6px;align-items:center}.pks small{color:var(--mt);margin-left:auto}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--sf);border:1px solid var(--ln);font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--ln)}th{font-weight:600;color:var(--mt);font-size:13px}.l{text-align:left}
tr.q td:first-child{box-shadow:inset 4px 0 var(--gr)}td:last-child{font-weight:700}
details{margin:6px 0}summary{cursor:pointer;font:600 17px 'Barlow Condensed',sans-serif;padding:6px 0}
.mr{display:grid;grid-template-columns:1fr 78px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.mr .ta{text-align:right}.sc{text-align:center}.w{font-weight:700}.mr small{color:var(--mt)}
.champ{background:var(--ac);color:#14201A;padding:12px 14px;border-radius:8px;font:700 22px 'Barlow Condensed',sans-serif;margin:10px 0}
#fl{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px}

.bd{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--ln);font:700 10px Barlow,sans-serif;color:#fff;text-shadow:0 0 3px #000;vertical-align:middle}
.tn{display:inline-flex;align-items:center;gap:8px}.mr{grid-template-columns:1fr auto 1fr}.ta,.tb{display:flex;align-items:center;gap:8px}.ta{justify-content:flex-end}
.gi{width:52px;text-align:center}input[type=color]{padding:2px;width:38px;height:34px}.pks label{align-items:center}.sc select{max-width:210px;margin:4px 0}

:root{--sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.07)}
header{max-width:none!important;padding:0!important;background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 44px,transparent 44px 88px),linear-gradient(135deg,#0d3320,#1e5b3a);color:#fff}
header>*{max-width:920px;margin-left:auto;margin-right:auto;padding-left:16px;padding-right:16px}
header h1{padding-top:18px;margin-bottom:10px;color:#fff}header h1::before{content:'⚽ '}
nav{border-bottom:0;gap:2px}nav button{color:#bfd8c8;border-radius:10px 10px 0 0;border-color:transparent;font-weight:600}
nav button:hover{color:#fff;transform:none}nav button.on{background:var(--bg);color:var(--gr);border-color:var(--bg)}
main{padding-top:6px}h2{padding-left:10px;border-left:5px solid var(--ac)}
.card{border-radius:12px;box-shadow:var(--sh);border-color:transparent}.card[onclick]:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.14)}
button{border-radius:8px;transition:.12s}button:hover:not(:disabled){transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}
.pr{background:linear-gradient(180deg,var(--g2),var(--gr));font-weight:600}
table{border-radius:10px;overflow:hidden;box-shadow:var(--sh);border-color:transparent}
thead th{background:color-mix(in srgb,var(--gr) 14%,var(--sf))}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ln) 22%,transparent)}tbody tr:hover td{background:color-mix(in srgb,var(--ac) 25%,transparent)}
.champ::before{content:'🏆 '}.champ{box-shadow:var(--sh)}
.hero{background:var(--sf);border-radius:14px;padding:4px 16px 12px;box-shadow:var(--sh);border-left:6px solid var(--gr);margin:12px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--sf);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}.kpi b{display:block;font:700 32px/1 'Barlow Condensed',sans-serif}.kpi span{color:var(--mt);font-size:13px}
.prog{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:10px 0 2px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),var(--g2))}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ln)}.tag.hi{background:var(--ac);color:#14201A}.tag.ok{background:var(--gr);color:#fff}
.want{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
@media(max-width:560px){nav button{padding:9px 10px;font-size:14px}.mr{font-size:14px}h1{font-size:30px}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}.cb{text-align:left}.cb.has{border-color:var(--gr);font-weight:600}.cb small{color:var(--mt)}
.tro{object-fit:contain;vertical-align:middle}.champ.ti::before{content:none}.champ.ti{display:flex;align-items:center;gap:10px}.bd{overflow:hidden}
.btnl{display:inline-block;padding:9px 16px;border-radius:8px;background:linear-gradient(180deg,var(--g2),var(--gr));color:#fff!important;text-decoration:none;font-weight:600}textarea{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);width:100%}
</style><script src="config.js"></script><meta name="description" content="MiTorneo: simula ligas, copas, Liga MX, Mundiales de 32 y 48 selecciones y mucho más."><meta property="og:type" content="website"><meta property="og:title" content="MiTorneo"><meta property="og:description" content="Simula ligas, copas, Liga MX y Mundiales con tus propios equipos y selecciones."><meta name="theme-color" content="#1e5b3a"><link rel="icon" type="image/png" href="favicon.png"></head><body>
<header><h1>MiTorneo</h1><nav>
<button data-t="teams" onclick="go('teams')">Equipos</button><button data-t="tours" onclick="go('tours')">Torneos</button><button data-t="hist" onclick="go('hist')">Historial</button><button data-t="tabla" onclick="go('tabla')">Tabla histórica</button></nav></header>
<main id="v"></main><div id="fl" hidden></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),L='ABCDEFGH';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={teams:[],tours:[]},ui={tab:'teams',q:'',tid:null,eid:null,del:null,dt:null,ha:'',hb:''};
try{const d=JSON.parse(localStorage.getItem('simfut')||'null');if(d)S=d}catch(e){}
const save=()=>{try{localStorage.setItem('simfut',JSON.stringify(S))}catch(e){}};
const flash=s=>{const e=$('#fl');e.textContent=s;e.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>e.hidden=true,2800)};
const T=id=>S.teams.find(t=>t.id===id),tm=(t,id)=>t.teams.find(x=>x.id===id),clamp=v=>Math.max(0,Math.min(100,Math.round(+v||0)));
var go=t=>{ui.tab=t;ui.tid=null;render()};
var tn=t=>t.type==='liga'?'Liga ida y vuelta':t.fmt==='grupos'?'Copa con fase de grupos':'Copa de eliminación directa';
const allM=()=>S.tours.flatMap(t=>t.matches.filter(m=>m.done).map(m=>({...m,tn:t.name})));
/* equipos */
function addTeam(){const n=$('#tn').value.trim();if(!n)return flash('Escribe un nombre');if(S.teams.some(t=>t.name.toLowerCase()===n.toLowerCase()))return flash('Ya existe un equipo con ese nombre');S.teams.push({id:uid(),name:n,r:clamp($('#tr').value)});save();render()}
function saveEdit(id){const n=$('#en').value.trim();if(!n)return flash('El nombre no puede quedar vacío');const t=T(id);t.name=n;t.r=clamp($('#er').value);ui.eid=null;save();render()}
function delTeam(id){S.teams=S.teams.filter(t=>t.id!==id);ui.del=null;save();render()}
function seed(){[['Atlético Norte',84],['Real Costa',81],['Unión del Valle',78],['Deportivo Sur',76],['Club Montaña',73],['Racing Puerto',71],['Sporting Río',68],['Juventud Central',66],['Estrella Roja',64],['Olimpia Azul',61],['Halcones FC',58],['Cóndores',55],['Tigres del Este',52],['Aurora',48],['Pioneros',44],['Ciudad Nueva',38]].forEach(([n,r])=>S.teams.push({id:uid(),name:n,r}));save();render()}
function tlist(){const q=ui.q.toLowerCase(),A=S.teams.filter(t=>t.name.toLowerCase().includes(q)).sort((a,b)=>b.r-a.r);
if(!A.length)return `<p class=mt>${S.teams.length?'Ningún equipo coincide con la búsqueda.':'Aún no hay equipos. Agrega el primero arriba.'}</p>`;
return A.map(t=>ui.eid===t.id?`<div class="card tr"><input id=en value="${esc(t.name)}" maxlength=30><input id=er type=number min=0 max=100 value=${t.r}><button class=pr onclick="saveEdit('${t.id}')">Guardar cambios</button><button onclick="ui.eid=null;render()">Cancelar</button></div>`:
`<div class="card tr"><b class=nm>${esc(t.name)}</b><span class=bar style="--v:${t.r}%"><i></i></span><span class=num>${t.r}</span>${ui.del===t.id?`<span>¿Eliminar? <button class=dg onclick="delTeam('${t.id}')">Sí, eliminar</button> <button onclick="ui.del=null;render()">No</button></span>`:`<span><button onclick="ui.eid='${t.id}';render()">Editar</button> <button onclick="ui.del='${t.id}';render()">Eliminar</button></span>`}</div>`).join('')}
var vTeams=()=>`<h2>Equipos</h2><div class=row><input type=text id=tn placeholder="Nombre del equipo" maxlength=30><input id=tr type=number min=0 max=100 value=70 title="Media de 0 a 100"><button class=pr onclick=addTeam()>Agregar equipo</button></div>
<div class=row><input type=text id=q placeholder="Buscar equipo" value="${esc(ui.q)}" oninput="ui.q=this.value;$('#tl').innerHTML=tlist()">${S.teams.length?'':'<button onclick=seed()>Cargar 16 equipos de ejemplo</button>'}</div><div id=tl>${tlist()}</div>`;
/* motor */
function circle(ids){const a=[...ids];if(a.length%2)a.push(null);const n=a.length,R=[];for(let r=0;r<n-1;r++){const p=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)p.push(r%2?[y,x]:[x,y])}R.push(p);a.splice(1,0,a.pop())}return R}
const mk=(t,a,b,round,stage,x)=>t.matches.push({id:uid(),a,b,na:tm(t,a).name,nb:tm(t,b).name,round,stage,done:false,...x});
const win=m=>m.ga>m.gb?m.a:m.gb>m.ga?m.b:(m.w==='a'?m.a:m.b);
const pois=l=>{const e=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>e);return k-1};
function play(t,m){const ra=tm(t,m.a).r,rb=tm(t,m.b).r;m.ga=pois(1.3*Math.exp((ra-rb)/55));m.gb=pois(1.3*Math.exp((rb-ra)/55));if(m.ko&&m.ga===m.gb){m.pen=1;m.w=Math.random()<.5+(ra-rb)/400?'a':'b'}m.done=true}
function table(ms,ids,t){const o={},g=(id,n)=>o[id]||(o[id]={id,name:n,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});(ids||[]).forEach(i=>g(i,tm(t,i).name));
ms.filter(m=>m.done).forEach(m=>[[m.a,m.na,m.ga,m.gb],[m.b,m.nb,m.gb,m.ga]].forEach(([id,n,f,c])=>{const r=g(id,n);r.name=n;r.pj++;r.gf+=f;r.gc+=c;if(f>c){r.g++;r.pts+=3}else if(f<c)r.p++;else{r.e++;r.pts++}}));
return Object.values(o).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||a.name.localeCompare(b.name))}
function genRound(t){const s=t.slots,rd=Math.max(0,...t.matches.map(m=>m.round))+1,n=s.length;t.rd=rd;const nm=n==2?'Final':n==4?'Semifinales':n==8?'Cuartos de final':n==16?'Octavos de final':'Ronda de '+n;
for(let i=0;i<n;i+=2)if(s[i]&&s[i+1])mk(t,s[i],s[i+1],rd,nm,{ko:1,pos:i/2})}
function advance(t){
if(t.type==='liga'){if(t.matches.every(m=>m.done)){t.done=true;t.champ=table(t.matches)[0].id}return}
if(t.fmt==='grupos'&&!t.slots){if(!t.matches.every(m=>m.done))return;const g=t.groups.length,W=[],R=[];t.groups.forEach((gr,i)=>{const tb=table(t.matches.filter(m=>m.grp===i),gr,t);W.push(tb[0].id);R.push(tb[1].id)});t.slots=[];for(let i=0;i<g;i++)t.slots.push(W[i],R[(i+1)%g]);genRound(t)}
while(t.slots&&!t.done){const cur=t.matches.filter(m=>m.ko&&m.round===t.rd);if(!cur.every(m=>m.done))return;const s=t.slots,n=[];
for(let i=0;i<s.length;i+=2){const m=cur.find(x=>x.pos===i/2);n.push(m?win(m):(s[i]||s[i+1]))}
if(n.length===1){t.done=true;t.champ=n[0];return}t.slots=n;genRound(t)}}
function createTour(){const ids=[...document.querySelectorAll('.pk:checked')].map(c=>c.value),type=$('#tty').value,fmt=type==='copa'?$('#tfm').value:'',g=+$('#tg').value;
if(ids.length<4)return flash('Selecciona al menos 4 equipos');if(fmt==='grupos'&&ids.length<g*3)return flash(`Para ${g} grupos necesitas al menos ${g*3} equipos`);
const t={id:uid(),name:$('#tnm').value.trim()||'Torneo '+(S.tours.length+1),type,fmt,teams:ids.map(i=>({id:i,name:T(i).name,r:T(i).r})),matches:[],done:false,champ:null};
const sorted=[...ids].sort((a,b)=>T(b).r-T(a).r);
if(type==='liga'){const R=circle(ids);R.forEach((p,i)=>p.forEach(([a,b])=>mk(t,a,b,i+1,'Jornada '+(i+1))));R.forEach((p,i)=>p.forEach(([a,b])=>mk(t,b,a,R.length+i+1,'Jornada '+(R.length+i+1))))}
else if(fmt==='grupos'){t.groups=Array.from({length:g},()=>[]);sorted.forEach((id,i)=>{const r=i/g|0,c=i%g;t.groups[r%2?g-1-c:c].push(id)});
t.groups.forEach((gr,gi)=>circle(gr).forEach((p,ri)=>p.forEach(([a,b])=>mk(t,a,b,ri+1,`Grupo ${L[gi]} · J${ri+1}`,{grp:gi}))))}
else{let size=2;while(size<ids.length)size*=2;let o=[1];while(o.length<size){const n=o.length*2;o=o.flatMap(s=>[s,n+1-s])}t.slots=o.map(s=>sorted[s-1]||null);genRound(t)}
S.tours.push(t);ui.tid=t.id;save();render()}
const gt=id=>S.tours.find(t=>t.id===id);
function sr(id){const t=gt(id),u=t.matches.filter(m=>!m.done);if(!u.length)return;const r=Math.min(...u.map(m=>m.round));u.filter(m=>m.round===r).forEach(m=>play(t,m));advance(t);save();render()}
function sa(id){const t=gt(id);for(let i=0;i<60&&!t.done;i++){const u=t.matches.filter(m=>!m.done);if(!u.length)break;const r=Math.min(...u.map(m=>m.round));u.filter(m=>m.round===r).forEach(m=>play(t,m));advance(t)}save();render()}
function pm(tid,mid){const t=gt(tid);play(t,t.matches.find(m=>m.id===mid));advance(t);save();render()}
function delTour(id){S.tours=S.tours.filter(t=>t.id!==id);ui.tid=null;ui.dt=null;save();render()}
/* vistas */
var tbl=(rows,k)=>`<div class=ov><table><thead><tr><th>#</th><th class=l>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${k&&i<k?'q':''}"><td>${i+1}</td><td class=l>${esc(r.name)}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.gf-r.gc}</td><td>${r.pts}</td></tr>`).join('')}</tbody></table></div>`;
var mrow=(t,m)=>{const w=m.done&&m.ga!==m.gb?(m.ga>m.gb?'a':'b'):m.w,tag=m.grp!=null?`<small>${L[m.grp]} </small>`:'';
return `<div class=mr><span class="ta ${m.done&&w==='a'?'w':''}">${tag}${esc(m.na)}</span>${m.done?`<span class=sc><b>${m.ga} - ${m.gb}</b>${m.pen?'<br><small>penales</small>':''}</span>`:`<span class=sc><button class=sm onclick="pm('${t.id}','${m.id}')">Jugar</button></span>`}<span class="${m.done&&w==='b'?'w':''}">${esc(m.nb)}</span></div>`};
function vDet(t){const pend=t.matches.filter(m=>!m.done);let h=`<div class=row><button onclick="ui.tid=null;render()">← Torneos</button></div><h2>${esc(t.name)}</h2><p class=mt>${tn(t)}, ${t.teams.length} equipos</p>`;
if(t.done)h+=`<div class=champ>Campeón: ${esc(tm(t,t.champ).name)}</div>`;
else h+=`<div class=row><button class=pr onclick="sr('${t.id}')">Simular ${t.type==='liga'?'jornada':'ronda'}</button><button onclick="sa('${t.id}')">Simular todo el torneo</button></div>`;
h+=`<div class=row>${ui.dt===t.id?`¿Eliminar este torneo y sus partidos? <button class=dg onclick="delTour('${t.id}')">Sí, eliminar</button> <button onclick="ui.dt=null;render()">No</button>`:`<button onclick="ui.dt='${t.id}';render()">Eliminar torneo</button>`}</div>`;
if(t.type==='liga')h+='<h3>Clasificación</h3>'+tbl(table(t.matches,t.teams.map(x=>x.id),t));
else if(t.groups)t.groups.forEach((gr,i)=>h+=`<h3>Grupo ${L[i]}</h3>`+tbl(table(t.matches.filter(m=>m.grp===i),gr,t),2));
const G=new Map();t.matches.forEach(m=>{const k=m.grp!=null?'Fase de grupos, jornada '+m.round:m.stage;(G.get(k)||G.set(k,[]).get(k)).push(m)});
const first=[...G].find(([k,a])=>a.some(m=>!m.done));
h+='<h3>Partidos</h3>'+[...G].map(([k,a])=>`<details ${first&&first[0]===k?'open':''}><summary>${esc(k)}</summary>${a.map(m=>mrow(t,m)).join('')}</details>`).join('');return h}
function cpt(){$('#cp').hidden=$('#tty').value!=='copa';$('#tgl').hidden=$('#tfm').value!=='grupos'}
function vTours(){if(ui.tid){const t=gt(ui.tid);if(t)return vDet(t)}

</script><script>

`<div class="card tr">${badge(t.id)}<b class=nm>${esc(t.name)}</b><span class=bar style="--v:${t.r}%"><i></i></span><span class=num>${t.r}</span>${ui.del===t.id?`<span>¿Eliminar? <button class=dg onclick="delTeam('${t.id}')">Sí, eliminar</button> <button onclick="ui.del=null;render()">No</button></span>`:`<span><button onclick="startEd('${t.id}')">Editar</button> <button onclick="ui.del='${t.id}';render()">Eliminar</button></span>`}</div>`).join('')}

/* simulación: el nivel pesa mucho más */
function play(t,m){const ra=tm(t,m.a).r,rb=tm(t,m.b).r,d=ra-rb,p=1/(1+Math.exp(-d/22)),tot=2.5+Math.abs(d)/60;m.ga=pois(tot*p);m.gb=pois(tot*(1-p));if(m.ko&&m.ga===m.gb){m.pen=1;m.w=Math.random()<Math.min(.7,Math.max(.3,.5+d/250))?'a':'b'}m.done=true}
/* motor: Liga MX */
function advance(t){
if(t.type==='liga'){const d=t.matches.every(m=>m.done);t.done=d;t.champ=d?table(t.matches)[0].id:null;return}
if(!t.slots){if(!t.matches.every(m=>m.done))return;
if(t.type==='mx'){const tb=table(t.matches,t.teams.map(x=>x.id),t);t.slots=seedSlots(t,tb);genRound(t)}
else{const g=t.groups.length,W=[],R=[];t.groups.forEach((gr,i)=>{const tb=table(t.matches.filter(m=>m.grp===i),gr,t);W.push(tb[0].id);R.push(tb[1].id)});t.slots=[];for(let i=0;i<g;i++)t.slots.push(W[i],R[(i+1)%g]);genRound(t)}}
while(t.slots&&!t.done){const cur=t.matches.filter(m=>m.ko&&m.round===t.rd);if(!cur.every(m=>m.done))return;const s=t.slots,n=[];
for(let i=0;i<s.length;i+=2){const m=cur.find(x=>x.pos===i/2);n.push(m?win(m):(s[i]||s[i+1]))}
if(n.length===1){t.done=true;t.champ=n[0];return}t.slots=n;genRound(t)}}
const roman=n=>{let r='';[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']].forEach(([v,s])=>{while(n>=v){r+=s;n-=v}});return r};
const nextEd=c=>Math.max(0,...S.tours.filter(t=>t.compId===c.id).map(t=>t.ed))+1;
function build(c,ed,ids,sub){ids=shuf(ids);const g=c.g,t={id:uid(),compId:c.id,ed,sub,name:c.name+' '+roman(ed)+(sub?' '+sub:''),type:c.type,fmt:c.fmt,teams:ids.map(i=>({id:i,name:T(i).name,r:T(i).r})),matches:[],done:false,champ:null},sorted=shuf(ids);
if(c.type==='liga'){const R=circle(ids);R.forEach((p,i)=>p.forEach(([a,b])=>mk(t,a,b,i+1,'Jornada '+(i+1))));R.forEach((p,i)=>p.forEach(([a,b])=>mk(t,b,a,R.length+i+1,'Jornada '+(R.length+i+1))))}
else if(c.type==='mx')circle(ids).forEach((p,i)=>p.forEach(([a,b])=>sub==='Clausura'?mk(t,b,a,i+1,'Jornada '+(i+1)):mk(t,a,b,i+1,'Jornada '+(i+1))));
else if(c.fmt==='grupos'){t.groups=Array.from({length:g},()=>[]);sorted.forEach((id,i)=>{const r=i/g|0,k=i%g;t.groups[r%2?g-1-k:k].push(id)});t.groups.forEach((gr,gi)=>circle(gr).forEach((p,ri)=>p.forEach(([a,b])=>mk(t,a,b,ri+1,`Grupo ${L[gi]} · J${ri+1}`,{grp:gi}))))}
else{let size=2;while(size<ids.length)size*=2;let o=[1];while(o.length<size){const n=o.length*2;o=o.flatMap(s=>[s,n+1-s])}t.slots=o.map(s=>sorted[s-1]||null);genRound(t)}
return t}
function createComp(){const type=$('#tty').value,c={id:uid(),name:$('#tnm').value.trim()||'Competición '+(S.comps.length+1),type,fmt:type==='copa'?$('#tfm').value:'',g:+$('#tg').value};S.comps.push(c);ui.cid=c.id;ui.nf=true;save();render()}

const ed=nextEd(c);(c.type==='mx'?['Apertura','Clausura']:[null]).forEach(s=>S.tours.push(build(c,ed,ids,s)));ui.ed=ed;ui.sub='Apertura';ui.nf=false;save();render()}

function tbl(rows,k){return `<div class=ov><table><thead><tr><th>#</th><th class=l>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${k&&i<k?'q':''}"><td>${i+1}</td><td class=l><span class=tn>${badge(r.id,r.name)}${esc(r.name)}</span></td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.gf-r.gc}</td><td>${r.pts}</td></tr>`).join('')}</tbody></table></div>`}

else if(t.groups)t.groups.forEach((gr,i)=>h+=`<h3>Grupo ${L[i]}</h3>`+tbl(table(t.matches.filter(m=>m.grp===i),gr,t),2));

function vFormEd(c){const ts=S.tours.filter(t=>t.compId===c.id),p=ts.sort((a,b)=>b.ed-a.ed)[0],pre=new Set(p?p.teams.map(x=>x.id):[]),min=c.type==='mx'?16:4;

const ts=S.tours.filter(t=>t.compId===c.id),eds=[...new Set(ts.map(t=>t.ed))].sort((a,b)=>a-b),q=(k,txt,fn)=>ui.dt===k?`¿Seguro? <button class=dg onclick="${fn}()">Sí, eliminar</button> <button onclick="ui.dt=null;render()">No</button>`:`<button onclick="ui.dt='${k}';render()">${txt}</button>`;
